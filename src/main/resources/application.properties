spring.application.name=clubhub4

# ==============================================================================
# DATASOURCE CONFIGURATION
# ==============================================================================
# OPTION A (Active / Recommended): Dynamic Configuration
# Automatically uses Render / cloud environment variables if provided.
# Falls back to local PostgreSQL when running locally.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clubhub4}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dsi}
spring.datasource.driver-class-name=org.postgresql.Driver

# OPTION B: Direct Supabase Connection (For running locally connected to Supabase)
# To use this locally, uncomment the 3 lines below and paste your password:
# spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
# spring.datasource.username=postgres.ilzhkaoqtbvryjewhgab
# spring.datasource.password=YOUR_SUPABASE_PASSWORD_HERE
# ==============================================================================

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Configure Flyway to repair the database when validation fails
spring.flyway.repair-on-migrate=true

# Thymeleaf Configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Logging Configuration
logging.level.com.example.university=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.thymeleaf=DEBUG

# File Upload Configuration
app.media.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false



server.port=8080